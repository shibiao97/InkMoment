<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>影刻 InkMoment</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f7f8fb;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(560px, calc(100vw - 40px));
        padding: 28px;
        border: 1px solid #d8dee8;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 18px 60px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 700;
      }

      p {
        margin: 0;
        line-height: 1.7;
        font-size: 15px;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.95em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>InkMoment 前端资源未构建</h1>
      <p>
        当前服务已启动，但没有找到 <code>static/vue/index.html</code>。
        开发环境请先运行 <code>npm run frontend:build</code>，桌面发布包请使用打包流程生成的资源。
      </p>
    </main>
  </body>
</html>
