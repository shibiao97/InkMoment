name: Desktop Release

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Flutter DMG
            os: macos-14
            bundle: dmg
            npm_script: desktop:release:mac
            build_args: --ci
            artifact_name: InkMoment-macOS-flutter-dmg
            artifact_path: dist/flutter-desktop/macos/release/*.dmg
          - name: Windows Flutter Bundle
            os: windows-2022
            bundle: zip
            npm_script: desktop:release:win
            build_args: --ci
            artifact_name: InkMoment-Windows-flutter
            artifact_path: dist/flutter-desktop/windows/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python desktop dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=".venv/Scripts/python.exe"
          else
            PY=".venv/bin/python"
          fi
          "$PY" -m pip install --upgrade pip wheel setuptools
          "$PY" -m pip install -r requirements.txt -r requirements-desktop.txt
          "$PY" -m pip uninstall -y opencv-python opencv-python-headless || true
          "$PY" -m pip install --force-reinstall --no-deps "opencv-contrib-python>=4.9"

      - name: Run backend unit tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=".venv/Scripts/python.exe"
          else
            PY=".venv/bin/python"
          fi
          "$PY" -m unittest discover -s tests -p 'test_*.py'

      - name: Build Flutter desktop release
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=".venv/Scripts/python.exe"
          else
            PY=".venv/bin/python"
          fi
          INKMOMENT_PYTHON="$PY" npm run ${{ matrix.npm_script }} -- ${{ matrix.build_args }}

      - name: Verify Flutter desktop artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=".venv/Scripts/python.exe"
          else
            PY=".venv/bin/python"
          fi
          "$PY" scripts/verify_desktop_release.py --bundle ${{ matrix.bundle }} --profile release

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
